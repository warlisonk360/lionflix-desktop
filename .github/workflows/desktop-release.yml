name: Desktop Release

# Gera o AppImage (Linux) e o .exe (Windows) e publica numa Release do GitHub,
# onde os arquivos ficam disponíveis para download direto.
#
# Como publicar uma versão nova:
#   1. Atualize "version" em package.json (ex.: 0.2.0)
#   2. No site do GitHub: Releases -> Draft a new release -> digite a tag v0.2.0
#      ("Create new tag: v0.2.0 on publish") -> Publish release
#   -> o workflow builda e anexa o AppImage e o .exe nessa Release.
#
# Também dá para rodar manualmente (aba Actions -> "Run workflow").

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux AppImage
            files: |
              dist/*.AppImage
              dist/*.yml
              dist/*.blockmap
          - os: windows-latest
            args: --win
            files: |
              dist/*.exe
              dist/*.yml
              dist/*.blockmap
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Usa o Node que já vem instalado no runner (sem actions/setup-node,
      # que era o passo que estava quebrando o build).
      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Versões (diagnóstico)
        run: |
          node -v
          pnpm -v

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Empacotar (${{ matrix.os }})
        run: pnpm exec electron-builder ${{ matrix.args }} --publish never

      - name: Guardar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: LionFlix-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publicar Release
    needs: build
    # Roda mesmo se um dos builds falhar (publica o que conseguiu gerar).
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar artefatos
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Criar Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          draft: false
          generate_release_notes: true
